version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gazeguard-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./backend/app/database/gazeguard.db
      - RAW_DATA_DIR=./data/raw
      - SYNTHETIC_DATA_DIR=./data/synthetic
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gazeguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
