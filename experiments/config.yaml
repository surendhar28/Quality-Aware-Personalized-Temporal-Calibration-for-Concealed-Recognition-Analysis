experiment:
  name: gazeguard_fresh_baseline
  version: "2.0.0"
  random_seed: 42

dataset:
  source: zenodo_derived_feature_table
  input: data/processed/zenodo_features.csv
  expected_rows: 819
  expected_participants: 38

features:
  - valid_sample_ratio
  - early_window_sample_count
  - early_probe_fix_dur
  - early_irrel_fix_dur
  - early_probe_diff
  - mid_probe_diff
  - late_probe_diff
  - total_probe_diff
  - mean_fix_duration
  - median_fix_duration
  - fixation_count

evaluation:
  strategy: StratifiedGroupKFold
  n_splits: 5
  shuffle: true
  random_seed: 42
  primary_unit: participant
  aggregation: mean_held_out_row_probability
  decision_threshold: 0.5
  bootstrap_replicates: 10000

models:
  logistic_regression:
    C: 1.0
    penalty: l2
    class_weight: balanced
    max_iter: 3000

  random_forest:
    n_estimators: 500
    max_depth: 5
    min_samples_leaf: 3
    class_weight: balanced

  xgboost:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 2

preprocessing:
  imputation: median
  fit_within_training_fold: true
  logistic_regression_scaling: standard_scaler
  probability_calibration: false
  feature_selection: false
  hyperparameter_tuning: false
